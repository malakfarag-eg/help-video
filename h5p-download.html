<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحميل ملف H5P</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f1fb;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
.c{padding:24px;max-width:420px}button,a.b{display:block;width:100%;box-sizing:border-box;font-size:22px;padding:18px;border:0;border-radius:16px;background:#7b3fe4;color:#fff;margin:14px 0;text-decoration:none}button:disabled{background:#aaa}p{font-size:18px;color:#333}</style></head>
<body><div class="c"><h2>الفيديو التفاعلي (ملف H5P)</h2><p id="st">جاري التجهيز... استني ثواني</p>
<button id="go" disabled>تحميل الملف</button><a id="lnk" class="b" style="display:none" download="help-video-interactive.h5p">لو التحميل ما بدأش اضغطي هنا</a>
<p style="font-size:14px">اسم الملف: help-video-interactive.h5p</p></div>
<script>
var N=31,P=[];for(var i=0;i<N;i++)P.push("hvpart"+(i<10?"0":"")+i+".txt");
var go=document.getElementById('go'),st=document.getElementById('st'),lnk=document.getElementById('lnk'),url=null;
function b64(t){var s=atob(t.replace(/\s/g,"")),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
Promise.all(P.map(function(p){return fetch(p).then(function(r){if(!r.ok)throw 0;return r.text()}).then(b64)})).then(function(bs){
 var blob=new Blob(bs,{type:"application/octet-stream"});url=URL.createObjectURL(blob);lnk.href=url;
 st.textContent="الملف جاهز ("+(blob.size/1048576).toFixed(1)+" ميجا)";go.disabled=false;
}).catch(function(){st.textContent="حصلت مشكلة، حدّثي الصفحة"});
go.onclick=function(){if(!url)return;lnk.style.display="block";lnk.click()};
</script></body></html>
